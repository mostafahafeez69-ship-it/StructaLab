<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Structa Pro</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--brand:#1d4ed8;--v-pos:#2563eb;--v-neg:#ea580c;--m-pos:#16a34a;--m-neg:#9333ea;--load:#dc2626;--react:#0d9488}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--card:#1a1f26;--ink:#e5e7eb;--mute:#9ca3af;--line:#2b323c;--brand:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}header span{color:var(--mute);font-size:13px}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 8px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mute)}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;gap:8px;margin-bottom:8px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}
.load{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;position:relative}
.load b{font-size:12px}
.load button.del{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:8px}
#report{min-width:0}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 26px}
.sheet h2{font-size:17px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--brand)}
.sheet h3{font-size:14px;margin:14px 0 6px}
.doc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.doc-h h1{margin:0;font-size:20px}.doc-h small{color:var(--mute)}
.eq{font-family:Cambria,'Times New Roman',serif;font-size:16px;background:rgba(29,78,216,.06);border-left:3px solid var(--brand);padding:6px 10px;margin:5px 0;border-radius:0 6px 6px 0;overflow-x:auto}
.eq.v{border-color:var(--v-pos);background:rgba(37,99,235,.07)}.eq.m{border-color:var(--m-pos);background:rgba(22,163,74,.07)}
.note{font-size:13px;color:var(--mute)}
.conv{background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.5);border-radius:8px;padding:8px 12px;font-size:13px}
.ans{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:right}th{background:rgba(127,127,127,.08)}td:first-child,th:first-child{text-align:left}
svg{width:100%;height:auto;display:block}
svg text{font-family:Cambria,'Times New Roman',serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.ok{color:#15803d;font-weight:600}.bad{color:#b91c1c;font-weight:600}
.int{break-inside:avoid;margin-bottom:10px}
@media print{
  body{background:#fff;color:#000}header,.panel,.noprint{display:none!important}
  .wrap{display:block;padding:0;max-width:none}.sheet,.card{border:0;padding:0;background:#fff}
  :root{--ink:#000;--card:#fff;--line:#ccc;--mute:#444}
  .sheet h2{break-after:avoid}.eq,svg{break-inside:avoid}
}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px}
.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
:root{--n-pos:#0e7490;--n-neg:#be185d}
.panel select,.panel input{width:100%}
#licGate{position:fixed;inset:0;z-index:9999;background:var(--bg,#f5f6f8);display:flex;align-items:center;justify-content:center;padding:16px}
#licGate .box{max-width:460px;width:100%;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:12px;padding:24px}
#licGate h1{margin:0 0 6px;font-size:22px}#licGate textarea{width:100%;min-height:92px;margin:12px 0 8px;font:12px monospace;padding:8px;box-sizing:border-box}
#licMsg{color:#b91c1c;min-height:20px;font-size:14px}#licStamp{position:fixed;right:10px;bottom:6px;font-size:11px;color:var(--mute,#666);opacity:.8;z-index:50}
@media print{#licStamp{display:block!important;opacity:1}}</style>
</head>
