<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Structa Continuous – Continuous Beam Solver</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14212e;--mute:#5b6b7a;--line:#dbe3ea;--brand:#0F2A44;--acc:#2EC4B6;--red:#d62828}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1722;--card:#13212f;--ink:#e6edf3;--mute:#9fb0bf;--line:#26394b;--brand:#2EC4B6;--acc:#2EC4B6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#0F2A44;color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:3px solid var(--acc)}
header h1{margin:0;font-size:19px}header span{color:#9fd8d2;font-size:12.5px}
main{max-width:1280px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:11.5px;color:var(--mute)}
input,select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 11px}
.btn.p{background:#0F2A44;border-color:#0F2A44;color:#fff}.btn.t{background:var(--acc);border-color:var(--acc);color:#06222a;font-weight:600}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:3px 5px;text-align:right;vertical-align:top}th{background:rgba(46,196,182,.12);font-size:11.5px;position:sticky;top:0}
td.l,th.l{text-align:left}td input,td select{padding:3px 4px;font-size:12.5px}
.dims{display:flex;gap:4px;flex-wrap:wrap;min-width:230px}.dims label{width:74px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:0;background:none;color:var(--red);font-size:16px}.dup{border:0;background:none;color:var(--mute);font-size:14px}
.note{font-size:12px;color:var(--mute)}.warn{background:rgba(214,40,40,.1);border:1px solid rgba(214,40,40,.4);color:var(--red);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:12.5px}
.tot td{font-weight:700;background:rgba(15,42,68,.07)}details{margin-top:6px}details pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);padding:8px;border-radius:6px;margin:6px 0 0}
#licGate{position:fixed;inset:0;z-index:9999;background:var(--bg,#f5f6f8);display:flex;align-items:center;justify-content:center;padding:16px}
#licGate .box{max-width:460px;width:100%;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:12px;padding:24px}
#licGate h1{margin:0 0 6px;font-size:22px}#licGate textarea{width:100%;min-height:92px;margin:12px 0 8px;font:12px monospace;padding:8px;box-sizing:border-box}
#licMsg{color:#b91c1c;min-height:20px;font-size:14px}#licStamp{position:fixed;right:10px;bottom:6px;font-size:11px;color:var(--mute,#666);opacity:.8;z-index:50}
[hidden]{display:none!important}
.pr{display:none}
@media print{header,.noprint,.bar,.del,.dup,details{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}.pr{display:block}#licStamp{display:block!important;opacity:1}input,select{border:0;background:none;padding:0;appearance:none;color:#000}main{padding:0}th{position:static}}

.wrap{display:grid;grid-template-columns:380px 1fr;gap:12px}@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.row{display:grid;gap:6px;margin-bottom:6px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}
.sp{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.sp h3{margin:0 0 6px;font-size:13px}
.ld{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;position:relative}.ld .del{position:absolute;right:0;top:2px}
.sheet h2{font-size:16px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--acc)}.sheet h3{font-size:13.5px;margin:12px 0 4px}
.eq{font-family:Cambria,'Times New Roman',serif;font-size:15px;background:rgba(46,196,182,.1);border-left:3px solid var(--acc);padding:4px 10px;margin:4px 0;border-radius:0 6px 6px 0;overflow-x:auto}
svg{width:100%;height:auto;display:block}svg text{font:11px system-ui,sans-serif;fill:currentColor}
.md td,.md th{font-size:12px;padding:2px 6px}.md td:first-child,.md th:first-child{text-align:left}
@media print{.wrap{display:block}.panel{display:none}}
</style>
</head>
